<html>
<head>
    <title>My Daily Coffee Counter</title>
</head>
<style>
@import url('https://fonts.googleapis.com/css2?family=Elms+Sans:ital,wght@0,100..900;1,100..900&display=swap');
</style>
<link rel="stylesheet" href="css/index.css">
<body>
    <div class="container">
        <h1>My Daily Coffee Counter</h1>
        <p>Number of coffees consumed:</p>
        <p id="coffeeCount">0</p>
        <button type="button" id="incrementButton" class="button-increase"">Drink Coffee</button>
        <button type="button" id="decrementButton" class="button-decrease">Undo Coffee</button>
        <button type="button" id="saveCoffees" class="button-save">Save count</button>
        <p id="message">Previous number of coffees: <span id="previousCoffeeCount">0</span></p>
    </div>
</body>
<script src="scripts/script.js">
</script>
</html>
